name: Build & Release Electron App

on:
  push:
    tags:
      - "v*"  # A tag like v1.0.0 builds and publishes a GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # Needed by electron-builder to create the release

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1  # Tests don't launch Electron

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          CI: true

  build:
    needs: test  # A failing test stops the build, so it never reaches a release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build React app
        run: npm run build-react

      # On a tag, electron-builder uploads the installer, its blockmap and
      # latest.yml to the GitHub Release; electron-updater reads latest.yml.
      - name: Build installer
        shell: bash
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tmods-Downloader
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

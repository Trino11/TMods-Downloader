name: Build & Release Electron App

on:
  push:
    tags:
      - 'v*' # A tag like v1.0.0 builds and publishes a GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Needed by electron-builder to create the release

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # Tests don't launch Electron

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          CI: true

  build:
    name: build (${{ matrix.os }})
    needs: test # A failing test stops the build, so it never reaches a release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: Tmods-Downloader-windows
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            target: --mac
            artifact: Tmods-Downloader-mac
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - os: ubuntu-latest
            target: --linux
            artifact: Tmods-Downloader-linux
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build React app
        run: npm run build-react

      # Each OS only packages here; the release job below uploads all of them at once,
      # so three builds never race to create the same GitHub Release. The latest*.yml
      # files are what electron-updater reads on Windows and Linux.
      - name: Build installer
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # Mac builds are unsigned

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build # Only publishes once every OS has built
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The release stays a draft until every file is uploaded, so the app's updater never
      # sees a half-uploaded release. Uploads go one at a time and are retried, since a
      # single failed upload (GitHub answers 404 now and then) used to fail the release.
      - name: Publish GitHub Release
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          for file in dist/*; do
            for attempt in 1 2 3 4; do
              gh release upload "$GITHUB_REF_NAME" "$file" --clobber && break
              if [ "$attempt" = 4 ]; then
                echo "::error::Could not upload $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
